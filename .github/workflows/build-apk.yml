name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact Flutter version instead of floating on
      # channel: stable alone - this build confirmed the app compiles
      # cleanly on 3.47.1 (green run, 2026-08-23), and every build here
      # already prints "WARNING: Your app uses the following plugins that
      # apply Kotlin Gradle Plugin (KGP): home_widget, workmanager_android
      # ... Future versions of Flutter will fail to build if your app uses
      # plugins that apply KGP." With channel-only, the very next push
      # could silently pick up a newer Flutter release that trips that
      # warning into a hard failure, with no code change on our side to
      # explain it. Pinning means CI keeps using this exact
      # known-good version until someone deliberately bumps it here
      # (after checking those two plugins' changelogs for Built-in-Kotlin
      # support - see the migrate-to-built-in-kotlin guide linked in the
      # build log warning).
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Add missing android platform files if needed
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=pro_app .
          fi

      # Every fresh runner has no ~/.android/debug.keystore, so Gradle
      # auto-generates a brand new one on each build - a DIFFERENT signing
      # key (and therefore SHA-1 fingerprint) every single time, since the
      # app's release buildType still points at signingConfigs.debug (the
      # TODO left by `flutter create` to add a real release signing config
      # was never filled in). Any Google Cloud OAuth Android client
      # registered against one build's SHA-1 breaks on the very next build.
      # Restoring a stable, pre-generated keystore to that exact path fixes
      # it with no changes to any Gradle file: same key -> same SHA-1 on
      # every build, forever, so a Google OAuth client only has to be
      # registered once (see README "Google Drive Backup Setup").
      - name: Restore stable debug-signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set - falling back to a throwaway per-build keystore. Google sign-in will keep failing with DEVELOPER_ERROR until this secret is added (see README)."
          else
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored stable debug.keystore."
          fi

      # README step 3: CAMERA (service / 2nd-hand phone photos), INTERNET
      # (Google Drive backup - without this, every network call
      # google_sign_in/googleapis makes fails outright), POST_NOTIFICATIONS
      # (Android 13+ requires this manifest declaration before
      # OrderReminderService can even ask the user for the runtime "Allow
      # notifications?" permission - flutter_local_notifications does NOT
      # add this to the manifest automatically, the app must declare it
      # itself), and REQUEST_IGNORE_BATTERY_OPTIMIZATIONS (lets
      # background_tasks.dart's requestIgnoreBatteryOptimizations() show
      # the "Allow this app to ignore battery optimizations?" system
      # dialog - needed so the Daily Orders reminder and the daily Google
      # Drive backup keep running in the background on phones like Xiaomi/
      # MIUI, Vivo, and Oppo that otherwise silently kill them; see
      # DailyOrderScreen's "Reminder not showing up?" button) permissions.
      # Previously this was a manual, easy-to-forget step, and since
      # android/ is regenerated fresh by `flutter create` above on every
      # build that has never run before on this repo, a one-time manual
      # edit would never survive anyway. Idempotent: skips any permission
      # already present.
      - name: Add required Android permissions
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          needed = [
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>',
              # "Pick from Contacts" on the Daily Order supplier phone field
              # (flutter_contacts) - only used to read a number the shop
              # explicitly picks, never a background/bulk contacts read.
              '    <uses-permission android:name="android.permission.READ_CONTACTS"/>',
              # Daily Order exact-alarm reminder (DailyOrderAlarmReceiver,
              # see the FileProvider step below) - RECEIVE_BOOT_COMPLETED
              # lets the reminder re-arm itself after the phone restarts
              # (Android clears every AlarmManager alarm on reboot, which
              # would otherwise silently kill this reminder for good until
              # the owner happened to reopen Daily Order Settings).
              # SCHEDULE_EXACT_ALARM is what actually lets a *precise*
              # wall-clock-time alarm survive Doze/battery-optimisation on
              # Android 12+ (requested one-time via Settings; see
              # MainActivity's requestExactAlarmPermission).
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>',
          ]
          to_add = [line for line in needed if line.split('"')[1] not in content]

          if not to_add:
              print("Permissions already present, nothing to do.")
          else:
              match = re.search(r"<manifest[^>]*>", content)
              if not match:
                  raise SystemExit(f"Could not find <manifest> opening tag in {path} - aborting so this doesn't silently produce a broken manifest.")
              insert_at = match.end()
              content = content[:insert_at] + "\n" + "\n".join(to_add) + content[insert_at:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Added:", to_add)
          PYEOF

      # flutter_local_notifications (Daily Orders reminder - see
      # OrderReminderService) needs Android's "core library desugaring"
      # turned on in the app module, or the release build fails at Gradle's
      # AAR-metadata check with "Dependency ':flutter_local_notifications'
      # requires core library desugaring to be enabled for :app." Same
      # situation as the manifest permissions above: android/ is
      # regenerated fresh by `flutter create` every build, so this has to
      # be injected here rather than committed as a one-time manual edit.
      # Handles both the Kotlin DSL (build.gradle.kts) and Groovy
      # (build.gradle) app-module file, whichever `flutter create`
      # produced, and is idempotent - skips anything already present.
      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          python3 - <<'PYEOF'
          import re, glob

          candidates = glob.glob("android/app/build.gradle.kts") + glob.glob("android/app/build.gradle")
          if not candidates:
              raise SystemExit("Could not find android/app/build.gradle(.kts) - aborting so this doesn't silently skip a required fix.")
          path = candidates[0]
          is_kts = path.endswith(".kts")

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          changed = False

          desugar_flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if desugar_flag not in content:
              co_match = re.search(r"compileOptions\s*\{", content)
              if co_match:
                  insert_at = co_match.end()
                  content = content[:insert_at] + f"\n        {desugar_flag}" + content[insert_at:]
              else:
                  android_match = re.search(r"android\s*\{", content)
                  if not android_match:
                      raise SystemExit(f"Could not find android {{ block in {path} - aborting")
                  insert_at = android_match.end()
                  block = f"\n    compileOptions {{\n        {desugar_flag}\n    }}\n"
                  content = content[:insert_at] + block + content[insert_at:]
              changed = True

          if "coreLibraryDesugaring" not in content.replace(desugar_flag, ""):
              dep_line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              deps_match = re.search(r"(?<!android )dependencies\s*\{", content)
              if deps_match:
                  insert_at = deps_match.end()
                  content = content[:insert_at] + "\n" + dep_line + content[insert_at:]
              else:
                  content = content.rstrip("\n") + "\n\ndependencies {\n" + dep_line + "\n}\n"
              changed = True

          if changed:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Updated {path} for core library desugaring.")
          else:
              print("Core library desugaring already configured, nothing to do.")
          PYEOF

      # Daily Orders home-screen widget (Phase 2 - see
      # lib/core/services/daily_order_widget_service.dart). This is a real
      # native Android AppWidget, so it needs Kotlin + XML files under
      # android/, plus a manifest <receiver> entry - all of which have to be
      # written here rather than committed, for the same reason as every
      # other android/ edit in this workflow: `flutter create` above
      # regenerates that whole folder fresh on every build, so nothing
      # placed there directly would ever survive a checkout. Idempotent:
      # (re)writes the widget's own files every run (harmless - they're
      # always regenerated anyway) and only touches the manifest if the
      # receiver isn't already registered.
      - name: Add Daily Orders home screen widget (Phase 2)
        run: |
          python3 - <<'PYEOF'
          import os

          kotlin_dir = "android/app/src/main/kotlin/com/example/pro_app"
          layout_dir = "android/app/src/main/res/layout"
          xml_dir = "android/app/src/main/res/xml"
          drawable_dir = "android/app/src/main/res/drawable"
          manifest_path = "android/app/src/main/AndroidManifest.xml"

          os.makedirs(kotlin_dir, exist_ok=True)
          os.makedirs(layout_dir, exist_ok=True)
          os.makedirs(xml_dir, exist_ok=True)
          os.makedirs(drawable_dir, exist_ok=True)

          # Rounded-corner gradient card instead of the old flat rectangle -
          # matches the app's own brand gradient look instead of a plain
          # block of color sitting on the home screen.
          widget_background_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="18dp" />
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="#1E88E5"
                  android:endColor="#0D47A1" />
          </shape>
          '''

          provider_kt = '''package com.example.pro_app

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.view.View
          import android.widget.RemoteViews

          // Renders the Daily Orders home-screen widget from whatever
          // DailyOrderWidgetService (Dart side) last wrote via
          // HomeWidget.saveWidgetData. That plugin stores everything in a
          // plain SharedPreferences file named "HomeWidgetPreferences", read
          // directly below - a plain AppWidgetProvider (not the home_widget
          // plugin's own HomeWidgetProvider subclass) so this widget has no
          // dependency on that plugin's own lifecycle/version behaviour,
          // only on the SharedPreferences file format it happens to write.
          //
          // Three static layout tiers stand in for one true scrolling list -
          // a real scrolling widget needs a RemoteViewsService list adapter,
          // a much larger native component than this feature warrants.
          // "Maximum" just shows more static rows, not an actually
          // scrollable list - a trade-off called out up front.
          class DailyOrderWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  val widgetData = context.getSharedPreferences("HomeWidgetPreferences", Context.MODE_PRIVATE)
                  appWidgetIds.forEach { appWidgetId ->
                      updateAppWidget(context, appWidgetManager, appWidgetId, widgetData)
                  }
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int,
                  newOptions: android.os.Bundle
              ) {
                  val widgetData = context.getSharedPreferences("HomeWidgetPreferences", Context.MODE_PRIVATE)
                  updateAppWidget(context, appWidgetManager, appWidgetId, widgetData)
              }

              companion object {
                  private val itemIds = intArrayOf(
                      R.id.widget_item_0, R.id.widget_item_1, R.id.widget_item_2, R.id.widget_item_3,
                      R.id.widget_item_4, R.id.widget_item_5, R.id.widget_item_6, R.id.widget_item_7
                  )

                  fun updateAppWidget(
                      context: Context,
                      appWidgetManager: AppWidgetManager,
                      appWidgetId: Int,
                      widgetData: SharedPreferences
                  ) {
                      try {
                          val options = appWidgetManager.getAppWidgetOptions(appWidgetId)
                          val minWidth = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0)

                          val layoutId = when {
                              minWidth < 180 -> R.layout.daily_order_widget_mini
                              minWidth < 300 -> R.layout.daily_order_widget_medium
                              else -> R.layout.daily_order_widget_maximum
                          }
                          // Mini used to show 0 item rows (title + count only), which
                          // is why pending orders looked "invisible" on the home
                          // screen at the smallest drop-in size - every tier now
                          // shows at least a couple of items.
                          val itemRows = when (layoutId) {
                              R.layout.daily_order_widget_mini -> 2
                              R.layout.daily_order_widget_medium -> 4
                              else -> 8
                          }

                          val views = RemoteViews(context.packageName, layoutId)
                          val enabled = widgetData.getString("widget_enabled", "true") ?: "true"

                          if (enabled == "false") {
                              views.setTextViewText(R.id.widget_title, "Daily Orders (off)")
                              views.setTextViewText(R.id.widget_count, "Turn on in app Settings")
                          } else {
                              val supplierName = widgetData.getString("supplier_name", "Daily Orders") ?: "Daily Orders"
                              val pendingCount = widgetData.getInt("pending_count", 0)
                              views.setTextViewText(R.id.widget_title, supplierName)
                              views.setTextViewText(
                                  R.id.widget_count,
                                  if (pendingCount == 0) "No pending items" else "$pendingCount item(s) pending"
                              )
                          }

                          for (i in itemIds.indices) {
                              if (i >= itemRows) continue
                              val raw = if (enabled == "false") "" else (widgetData.getString("item_$i", "") ?: "")
                              views.setTextViewText(itemIds[i], if (raw.isEmpty()) "" else "• $raw")
                              views.setViewVisibility(itemIds[i], if (raw.isEmpty()) View.GONE else View.VISIBLE)
                          }

                          // Tapping anywhere on the widget - the card body or the "+ Add"
                          // button - launches QuickAddActivity directly: a separate,
                          // minimal Flutter engine/activity/task showing ONLY the
                          // quick-add screen (see QuickAddActivity.kt and
                          // lib/main.dart's quickAddMain()). This used to be a
                          // homewidgetpro://quickadd deep link routed through
                          // MainActivity itself, which is exactly why the tap still
                          // visibly "opened pro_app" no matter how the in-app routing
                          // was tuned - going straight to a dedicated Activity that
                          // never touches MainActivity is the actual fix. Runs in its
                          // own task, hidden from the recent-apps switcher (see the
                          // manifest entry below), so it behaves like a lightweight
                          // standalone popup, not a second app window.
                          val addIntent = Intent(context, QuickAddActivity::class.java)
                          addIntent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          val addPendingIntent = PendingIntent.getActivity(
                              context, 1, addIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, addPendingIntent)
                          views.setOnClickPendingIntent(R.id.widget_add_btn, addPendingIntent)

                          appWidgetManager.updateAppWidget(appWidgetId, views)
                      } catch (e: Exception) {
                          // Never let a widget refresh crash leave the launcher showing
                          // "Can't load widget" with no way to recover - fall back to the
                          // smallest layout with just a title, no data-dependent bindings
                          // or click handlers that could themselves be the cause.
                          try {
                              val fallback = RemoteViews(context.packageName, R.layout.daily_order_widget_mini)
                              fallback.setTextViewText(R.id.widget_title, "Daily Orders")
                              fallback.setTextViewText(R.id.widget_count, "Open the app to refresh")
                              appWidgetManager.updateAppWidget(appWidgetId, fallback)
                          } catch (_: Exception) {
                              // Truly nothing we can do - avoid a crash loop.
                          }
                      }
                  }
              }
          }
          '''

          widget_info_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/daily_order_widget_mini"
              android:previewImage="@mipmap/ic_launcher"
              android:minWidth="110dp"
              android:minHeight="40dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="40dp"
              android:maxResizeWidth="380dp"
              android:maxResizeHeight="300dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          '''

          # Pill-shaped translucent-white button background for the "+ Add"
          # quick-add button.
          add_btn_bg_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="20dp" />
              <solid android:color="#33FFFFFF" />
              <stroke android:width="1dp" android:color="#66FFFFFF" />
          </shape>
          '''

          def item_row(idx):
              return (
                  f'    <TextView\n'
                  f'        android:id="@+id/widget_item_{idx}"\n'
                  f'        android:layout_width="match_parent"\n'
                  f'        android:layout_height="wrap_content"\n'
                  f'        android:layout_marginTop="3dp"\n'
                  f'        android:textColor="#E3F2FD"\n'
                  f'        android:textSize="11.5sp"\n'
                  f'        android:maxLines="1"\n'
                  f'        android:ellipsize="end"\n'
                  f'        android:visibility="gone" />\n'
              )

          def widget_layout(item_count):
              items = "".join(item_row(i) for i in range(item_count))
              return (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    android:id="@+id/widget_root"\n'
                  '    android:layout_width="match_parent"\n'
                  '    android:layout_height="match_parent"\n'
                  '    android:orientation="vertical"\n'
                  '    android:padding="12dp"\n'
                  '    android:background="@drawable/widget_background">\n'
                  '\n'
                  '    <LinearLayout\n'
                  '        android:layout_width="match_parent"\n'
                  '        android:layout_height="wrap_content"\n'
                  '        android:orientation="horizontal"\n'
                  '        android:gravity="center_vertical">\n'
                  '\n'
                  '        <TextView\n'
                  '            android:id="@+id/widget_title"\n'
                  '            android:layout_width="0dp"\n'
                  '            android:layout_height="wrap_content"\n'
                  '            android:layout_weight="1"\n'
                  '            android:text="Daily Orders"\n'
                  '            android:textColor="#FFFFFF"\n'
                  '            android:textStyle="bold"\n'
                  '            android:textSize="14sp"\n'
                  '            android:maxLines="1"\n'
                  '            android:ellipsize="end" />\n'
                  '\n'
                  '        <TextView\n'
                  '            android:id="@+id/widget_add_btn"\n'
                  '            android:layout_width="wrap_content"\n'
                  '            android:layout_height="wrap_content"\n'
                  '            android:layout_marginStart="6dp"\n'
                  '            android:paddingHorizontal="10dp"\n'
                  '            android:paddingVertical="4dp"\n'
                  '            android:background="@drawable/widget_add_btn_bg"\n'
                  '            android:text="+ Add"\n'
                  '            android:textColor="#FFFFFF"\n'
                  '            android:textStyle="bold"\n'
                  '            android:textSize="11.5sp" />\n'
                  '    </LinearLayout>\n'
                  '\n'
                  '    <TextView\n'
                  '        android:id="@+id/widget_count"\n'
                  '        android:layout_width="match_parent"\n'
                  '        android:layout_height="wrap_content"\n'
                  '        android:layout_marginTop="1dp"\n'
                  '        android:text="No pending items"\n'
                  '        android:textColor="#BBDEFB"\n'
                  '        android:textSize="11sp"\n'
                  '        android:maxLines="1"\n'
                  '        android:ellipsize="end" />\n'
                  '\n'
                  '    <TextView\n'
                  '        android:layout_width="match_parent"\n'
                  '        android:layout_height="1dp"\n'
                  '        android:layout_marginTop="6dp"\n'
                  '        android:layout_marginBottom="4dp"\n'
                  '        android:background="#33FFFFFF" />\n'
                  '\n'
                  f'{items}'
                  '</LinearLayout>\n'
              )

          # Standalone Activity the widget's PendingIntent launches directly
          # (see the click handler in provider_kt above) - a SEPARATE
          # FlutterActivity + FlutterEngine from MainActivity, running only
          # the tiny quickAddMain() Dart entry point (lib/main.dart).
          # MainActivity/the rest of the app is never created, so a widget
          # tap no longer looks or behaves like "opening pro_app" - the
          # exact problem repeatedly reported. See the manifest block below
          # for why this runs in its own task, hidden from recents.
          quick_add_activity_kt = '''package com.example.pro_app

          import io.flutter.embedding.android.FlutterActivity

          class QuickAddActivity : FlutterActivity() {
              override fun getDartEntrypointFunctionName(): String = "quickAddMain"
          }
          '''

          files = {
              os.path.join(kotlin_dir, "DailyOrderWidgetProvider.kt"): provider_kt,
              os.path.join(kotlin_dir, "QuickAddActivity.kt"): quick_add_activity_kt,
              os.path.join(xml_dir, "daily_order_widget_info.xml"): widget_info_xml,
              os.path.join(drawable_dir, "widget_background.xml"): widget_background_xml,
              os.path.join(drawable_dir, "widget_add_btn_bg.xml"): add_btn_bg_xml,
              os.path.join(layout_dir, "daily_order_widget_mini.xml"): widget_layout(2),
              os.path.join(layout_dir, "daily_order_widget_medium.xml"): widget_layout(4),
              os.path.join(layout_dir, "daily_order_widget_maximum.xml"): widget_layout(8),
          }

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Wrote", path)

          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          blocks_to_add = []

          if "DailyOrderWidgetProvider" in manifest:
              print("Widget receiver already registered, nothing to do.")
          else:
              blocks_to_add.append(
                  '    <receiver android:name=".DailyOrderWidgetProvider" android:exported="true" android:label="Daily Orders">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/daily_order_widget_info" />\n'
                  '    </receiver>\n'
              )

          # QuickAddActivity (see quick_add_activity_kt above) - deliberately
          # NOT given an intent-filter (it's only ever launched via an
          # explicit Intent from the widget's own PendingIntent, never from
          # the launcher), so it needs no android:exported declaration.
          # singleTask + its own taskAffinity + excludeFromRecents keep it
          # fully separate from MainActivity's task - repeated widget taps
          # bring the same instance to front instead of stacking, it never
          # shows up as a second app in the recent-apps switcher, and
          # finishing it (see QuickAddOrderScreen's _closeToHomeScreen)
          # closes the whole thing straight back to the home screen. Uses a
          # plain built-in Android theme rather than the app's own
          # LaunchTheme/NormalTheme so this never shows the branded splash
          # that would make it look like "the app" opening.
          if "QuickAddActivity" in manifest:
              print("QuickAddActivity already registered, nothing to do.")
          else:
              blocks_to_add.append(
                  '    <activity\n'
                  '        android:name=".QuickAddActivity"\n'
                  '        android:theme="@android:style/Theme.Material.Light.NoActionBar"\n'
                  '        android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"\n'
                  '        android:hardwareAccelerated="true"\n'
                  '        android:windowSoftInputMode="adjustResize"\n'
                  '        android:launchMode="singleTask"\n'
                  '        android:taskAffinity="com.example.pro_app.quickadd"\n'
                  '        android:excludeFromRecents="true" />\n'
              )

          if blocks_to_add:
              idx = manifest.rfind("</application>")
              if idx == -1:
                  raise SystemExit(f"Could not find </application> in {manifest_path} - aborting so this doesn't silently produce a broken manifest.")
              manifest = manifest[:idx] + "".join(blocks_to_add) + manifest[idx:]
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print(f"Updated AndroidManifest.xml with {len(blocks_to_add)} new block(s).")
          PYEOF

      # One-click direct-to-WhatsApp PDF send for Daily Orders (spec: no
      # "which app" chooser, no "which number" prompt - open WhatsApp
      # itself with the order PDF attached in one hand-off). This needs a
      # FileProvider (Android forbids sharing a raw file:// path to another
      # app) plus a custom MainActivity.kt exposing a MethodChannel the
      # Dart side calls (see WhatsAppSmsService.shareFileToWhatsApp and
      # DailyOrderScreen._sendOrder). Same reason as every other android/
      # edit in this workflow: `flutter create` above regenerates that
      # whole folder fresh on every build, so nothing placed there directly
      # would ever survive a checkout. Idempotent: MainActivity.kt and
      # file_paths.xml are always rewritten (harmless), the build.gradle
      # dependency and manifest <provider> are only added if missing.
      - name: Add FileProvider + native one-click WhatsApp PDF share (Task 11)
        run: |
          python3 - <<'PYEOF'
          import os, re, glob

          kotlin_dir = "android/app/src/main/kotlin/com/example/pro_app"
          xml_dir = "android/app/src/main/res/xml"
          manifest_path = "android/app/src/main/AndroidManifest.xml"

          os.makedirs(kotlin_dir, exist_ok=True)
          os.makedirs(xml_dir, exist_ok=True)

          # Replaces Flutter's default MainActivity.kt (plain FlutterActivity,
          # no native code) with one that adds a single "pro_app/whatsapp_share"
          # MethodChannel. Its shareToWhatsApp handler builds one ACTION_SEND
          # intent carrying both the PDF (via FileProvider) and the caption
          # text, targeted directly at com.whatsapp via setPackage() so
          # Android's own "choose an app" chooser never appears. NOTE:
          # WhatsApp itself still shows its own contact/chat picker once
          # opened - Android has no public API to pre-select a specific chat
          # for a *file* share (only for plain wa.me text links, see
          # WhatsAppSmsService.sendWhatsApp) - so this isn't fully zero-tap,
          # but it removes both the app-chooser and the old awkward
          # two-message hand-off (chat message, then a separate file share).
          # Falls back to that old flow on the Dart side (see
          # daily_order_screen.dart) if WhatsApp isn't installed, or if
          # anything about the direct share fails.
          main_activity_kt = '''package com.example.pro_app

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.Signature
          import android.net.Uri
          import android.os.Build
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              private val channelName = "pro_app/whatsapp_share"

              // Lets Settings -> "App Signing Info" (admin-only) show this
              // exact install's certificate SHA-1, formatted the same way
              // Google Cloud Console expects it - so whoever manages the
              // Google Drive OAuth client can copy-paste it straight from
              // the phone instead of digging through a GitHub Actions log.
              // Reads the *running* APK's own signing certificate, so it's
              // always right even if a future build ever changes signing
              // again.
              private fun getSigningSha1(): String? {
                  return try {
                      val signatures: Array<Signature> = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          @Suppress("DEPRECATION")
                          val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                          val signingInfo = info.signingInfo
                          if (signingInfo != null && signingInfo.hasMultipleSigners()) {
                              signingInfo.apkContentsSigners
                          } else {
                              signingInfo?.signingCertificateHistory ?: arrayOf()
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                          @Suppress("DEPRECATION")
                          info.signatures ?: arrayOf()
                      }
                      if (signatures.isEmpty()) return null
                      val digest = MessageDigest.getInstance("SHA-1").digest(signatures[0].toByteArray())
                      digest.joinToString(":") { b -> String.format("%02X", b) }
                  } catch (e: Exception) {
                      null
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      if (call.method == "getSigningSha1") {
                          result.success(getSigningSha1())
                      } else if (call.method == "shareToWhatsApp") {
                          val filePath = call.argument<String>("filePath")
                          val text = call.argument<String>("text") ?: ""
                          // Already-sanitised digits-only phone (see
                          // WhatsAppSmsService._sanitizePhone on the Dart
                          // side) - null/blank if the caller didn't have a
                          // number to target.
                          val phone = call.argument<String>("phone")
                          try {
                              if (filePath == null) {
                                  result.success(false)
                              } else {
                                  val file = File(filePath)
                                  val uri: Uri = FileProvider.getUriForFile(this, "$packageName.wafileprovider", file)
                                  val intent = Intent(Intent.ACTION_SEND).apply {
                                      type = "application/pdf"
                                      putExtra(Intent.EXTRA_STREAM, uri)
                                      putExtra(Intent.EXTRA_TEXT, text)
                                      setPackage("com.whatsapp")
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      // "jid" is not a documented WhatsApp
                                      // API, but it's a long-standing,
                                      // widely-used extra that opens this
                                      // share directly into the given
                                      // contact's chat instead of showing
                                      // WhatsApp's own picker - one tap on
                                      // Send inside WhatsApp instead of
                                      // first having to choose who to send
                                      // to. If a WhatsApp version ever stops
                                      // honouring it, WhatsApp just falls
                                      // back to its normal picker - never
                                      // worse than before this was added.
                                      if (!phone.isNullOrBlank()) {
                                          putExtra("jid", "$phone@s.whatsapp.net")
                                      }
                                  }
                                  startActivity(intent)
                                  result.success(true)
                              }
                          } catch (e: Exception) {
                              // WhatsApp not installed, or anything else
                              // unexpected - let the Dart side fall back to
                              // the old two-step flow rather than leaving
                              // the shop owner stuck with no way to send.
                              result.success(false)
                          }
                      } else if (call.method == "scheduleDailyOrderAlarm") {
                          // Exact-time AlarmManager reminder (see
                          // DailyOrderAlarmReceiver.kt below) - far more
                          // reliable than WorkManager's 15-minute poll
                          // alone at actually firing on the shop's chosen
                          // minute, especially on Xiaomi/Vivo/Oppo builds
                          // that aggressively kill background JobScheduler
                          // work regardless of the battery-optimisation
                          // exemption (spec: "order not send automatically
                          // to fixed time ... no restriction settings um
                          // kuduthuttan appium remider varala").
                          val hour = call.argument<Int>("hour") ?: 12
                          val minute = call.argument<Int>("minute") ?: 30
                          DailyOrderAlarmReceiver.schedule(this, hour, minute)
                          result.success(true)
                      } else if (call.method == "cancelDailyOrderAlarm") {
                          DailyOrderAlarmReceiver.cancel(this)
                          result.success(true)
                      } else if (call.method == "requestExactAlarmPermission") {
                          // Android 12+ (API 31+) silently downgrades
                          // setExactAndAllowWhileIdle to an inexact alarm
                          // unless this one-time permission is granted via
                          // system Settings - there is no in-app runtime
                          // prompt for it, only this Settings screen
                          // hand-off (same one-tap pattern as
                          // requestIgnoreBatteryOptimizations in
                          // background_tasks.dart).
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              try {
                                  val intent = Intent(android.provider.Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM)
                                  intent.data = Uri.parse("package:$packageName")
                                  startActivity(intent)
                              } catch (e: Exception) {
                                  // Not supported on this OEM build - the
                                  // alarm still gets scheduled, just
                                  // possibly inexact; never crash the
                                  // settings screen over this.
                              }
                          }
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          '''

          # BroadcastReceiver that actually fires the exact-time Daily
          # Order reminder (scheduled by MainActivity's
          # scheduleDailyOrderAlarm above) and shows its notification
          # directly via NotificationManager - deliberately NOT going
          # through the Flutter engine/flutter_local_notifications at
          # all, so this keeps working even if the app process was fully
          # killed by the OS, which is exactly the situation this exists
          # to survive. Also handles BOOT_COMPLETED / MY_PACKAGE_REPLACED
          # to re-arm the alarm after a restart or app update, since
          # Android clears every AlarmManager alarm at both of those.
          daily_order_alarm_receiver_kt = '''package com.example.pro_app

          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import java.util.Calendar

          class DailyOrderAlarmReceiver : BroadcastReceiver() {
              companion object {
                  private const val PREFS_NAME = "daily_order_alarm_prefs"
                  private const val KEY_HOUR = "hour"
                  private const val KEY_MINUTE = "minute"
                  private const val KEY_ENABLED = "enabled"
                  private const val CHANNEL_ID = "daily_order_alarm_v1"
                  private const val NOTIFICATION_ID = 1002
                  private const val REQUEST_CODE = 5001
                  private const val ACTION_FIRE = "com.example.pro_app.DAILY_ORDER_ALARM"

                  fun schedule(context: Context, hour: Int, minute: Int) {
                      context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit()
                          .putInt(KEY_HOUR, hour)
                          .putInt(KEY_MINUTE, minute)
                          .putBoolean(KEY_ENABLED, true)
                          .apply()
                      armNext(context, hour, minute)
                  }

                  fun cancel(context: Context) {
                      context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit()
                          .putBoolean(KEY_ENABLED, false)
                          .apply()
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      am.cancel(pendingIntent(context))
                  }

                  private fun armNext(context: Context, hour: Int, minute: Int) {
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val cal = Calendar.getInstance()
                      cal.set(Calendar.HOUR_OF_DAY, hour)
                      cal.set(Calendar.MINUTE, minute)
                      cal.set(Calendar.SECOND, 0)
                      cal.set(Calendar.MILLISECOND, 0)
                      if (cal.timeInMillis <= System.currentTimeMillis()) {
                          cal.add(Calendar.DAY_OF_YEAR, 1)
                      }
                      try {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pendingIntent(context))
                      } catch (e: SecurityException) {
                          // Android 12+ without the "Alarms & reminders"
                          // permission granted yet - still schedule an
                          // inexact alarm rather than nothing at all; this
                          // becomes exact again automatically next time it
                          // reschedules once the owner grants the
                          // permission.
                          am.set(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pendingIntent(context))
                      }
                  }

                  private fun pendingIntent(context: Context): PendingIntent {
                      val intent = Intent(context, DailyOrderAlarmReceiver::class.java).apply { action = ACTION_FIRE }
                      return PendingIntent.getBroadcast(
                          context, REQUEST_CODE, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val enabled = prefs.getBoolean(KEY_ENABLED, false)
                  val hour = prefs.getInt(KEY_HOUR, 12)
                  val minute = prefs.getInt(KEY_MINUTE, 30)

                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == Intent.ACTION_MY_PACKAGE_REPLACED) {
                      if (enabled) armNext(context, hour, minute)
                      return
                  }

                  if (!enabled) return

                  showNotification(context)
                  armNext(context, hour, minute)
              }

              private fun showNotification(context: Context) {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "Daily Order Reminder (exact alarm)", NotificationManager.IMPORTANCE_HIGH)
                      channel.description = "Reminds you to send today's supplier order, timed to fire even when the app is closed"
                      nm.createNotificationChannel(channel)
                  }

                  val launchIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("open_daily_orders", true)
                  }
                  val contentIntent = PendingIntent.getActivity(
                      context, REQUEST_CODE, launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle("Order Time!")
                      .setContentText("Tap to open Daily Orders and send today's supplier order.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setAutoCancel(true)
                      .setContentIntent(contentIntent)
                      .build()

                  nm.notify(NOTIFICATION_ID, notification)
              }
          }
          '''

          file_paths_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="daily_order_pdfs" path="." />
          </paths>
          '''

          with open(os.path.join(kotlin_dir, "MainActivity.kt"), "w", encoding="utf-8") as f:
              f.write(main_activity_kt)
          print("Wrote MainActivity.kt")

          with open(os.path.join(kotlin_dir, "DailyOrderAlarmReceiver.kt"), "w", encoding="utf-8") as f:
              f.write(daily_order_alarm_receiver_kt)
          print("Wrote DailyOrderAlarmReceiver.kt")

          with open(os.path.join(xml_dir, "file_paths.xml"), "w", encoding="utf-8") as f:
              f.write(file_paths_xml)
          print("Wrote file_paths.xml")

          # androidx.core.content.FileProvider is very likely already on the
          # classpath transitively (most Flutter plugins pull in androidx
          # startup/core), but add it explicitly so the build never depends
          # on that being true.
          candidates = glob.glob("android/app/build.gradle.kts") + glob.glob("android/app/build.gradle")
          if not candidates:
              raise SystemExit("Could not find android/app/build.gradle(.kts) - aborting so this doesn't silently skip a required fix.")
          gradle_path = candidates[0]
          is_kts = gradle_path.endswith(".kts")

          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle_content = f.read()

          if "androidx.core:core-ktx" not in gradle_content and "androidx.core:core" not in gradle_content:
              dep_line = '    implementation("androidx.core:core-ktx:1.13.1")' if is_kts else "    implementation 'androidx.core:core-ktx:1.13.1'"
              deps_match = re.search(r"(?<!android )dependencies\s*\{", gradle_content)
              if deps_match:
                  insert_at = deps_match.end()
                  gradle_content = gradle_content[:insert_at] + "\n" + dep_line + gradle_content[insert_at:]
              else:
                  gradle_content = gradle_content.rstrip("\n") + "\n\ndependencies {\n" + dep_line + "\n}\n"
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gradle_content)
              print(f"Added androidx.core:core-ktx dependency to {gradle_path}")
          else:
              print("androidx.core already a dependency, nothing to do.")

          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          if "wafileprovider" in manifest:
              print("FileProvider already registered, nothing to do.")
          else:
              provider_block = (
                  '    <provider\n'
                  '        android:name="androidx.core.content.FileProvider"\n'
                  '        android:authorities="${applicationId}.wafileprovider"\n'
                  '        android:exported="false"\n'
                  '        android:grantUriPermissions="true">\n'
                  '        <meta-data\n'
                  '            android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '            android:resource="@xml/file_paths" />\n'
                  '    </provider>\n'
              )
              idx = manifest.rfind("</application>")
              if idx == -1:
                  raise SystemExit(f"Could not find </application> in {manifest_path} - aborting so this doesn't silently produce a broken manifest.")
              manifest = manifest[:idx] + provider_block + manifest[idx:]
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print("Registered FileProvider.")

          # DailyOrderAlarmReceiver (see daily_order_alarm_receiver_kt
          # above) - exported=false since it's only ever triggered by this
          # app's own AlarmManager PendingIntent or by the system boot/
          # package-replaced broadcasts below, never by another app.
          if "DailyOrderAlarmReceiver" in manifest:
              print("Daily Order alarm receiver already registered, nothing to do.")
          else:
              receiver_block = (
                  '    <receiver android:name=".DailyOrderAlarmReceiver" android:exported="false">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '            <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '        </intent-filter>\n'
                  '    </receiver>\n'
              )
              idx = manifest.rfind("</application>")
              if idx == -1:
                  raise SystemExit(f"Could not find </application> in {manifest_path} - aborting so this doesn't silently produce a broken manifest.")
              manifest = manifest[:idx] + receiver_block + manifest[idx:]
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print("Registered DailyOrderAlarmReceiver.")
          PYEOF

      # Proper small notification icon (Task: "pro_app notification icon set
      # pannu"). Android 5.0+ renders the status-bar notification icon as a
      # plain white silhouette from the alpha channel only - it never shows
      # the source image's actual colours. OrderReminderService was pointing
      # flutter_local_notifications at @mipmap/ic_launcher (the full-colour
      # app icon), which Android then collapses into a blank/unrecognisable
      # white blob in the status bar. This adds a proper flat white-on-
      # transparent vector icon (a simple phone glyph, Apache-2.0 Material
      # Icons "smartphone" glyph) at res/drawable/ic_notification.xml, which
      # order_reminder_service.dart now points at instead. Same reason as
      # every other android/ edit in this workflow: `flutter create` above
      # regenerates that whole folder fresh on every build. Idempotent:
      # always rewrites the same file (harmless).
      - name: Add proper notification small-icon (notification icon task)
        run: |
          python3 - <<'PYEOF'
          import os

          drawable_dir = "android/app/src/main/res/drawable"
          os.makedirs(drawable_dir, exist_ok=True)

          notification_icon_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M17,1.01L7,1c-1.1,0-2,0.9-2,2v18c0,1.1,0.9,2,2,2h10c1.1,0,2-0.9,2-2L19,3c0,-1.1,-0.9,-1.99,-2,-1.99zM17,19L7,19L7,5h10v14z" />
          </vector>
          '''

          with open(os.path.join(drawable_dir, "ic_notification.xml"), "w", encoding="utf-8") as f:
              f.write(notification_icon_xml)
          print("Wrote ic_notification.xml")
          PYEOF

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Print release APK signing SHA-1 (for OAuth client comparison)
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true
          echo "---apksigner verify (v2/v3 signing cert)---"
          APKSIGNER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name apksigner 2>/dev/null | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          echo "---applicationId---"
          grep -R "applicationId" android/app/build.gradle* || true

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
