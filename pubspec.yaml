name: professional_mobiles
description: "Professional Mobiles & Laptop Service - Offline Business Management App (Service, Sales, 2nd Hand Mobile, Inventory, Profit & Loss)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local offline database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management (simple, no server dependency)
  provider: ^6.1.2

  # IDs / formatting
  uuid: ^4.4.0
  intl: ^0.19.0

  # PDF generation + printing (A5 bills)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Photos (service photos, 2nd hand phone photos)
  image_picker: ^1.1.2

  # Charts (simple P&L charts)
  fl_chart: ^0.68.0

  # WhatsApp / SMS share (opens native share sheet or wa.me / sms: links)
  url_launcher: ^6.3.0

  # Optional Google Drive backup (requires the shop owner's own Google Cloud
  # OAuth client id - see README "Google Drive Backup Setup")
  google_sign_in: ^7.2.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.1

  # Daily automatic Google Drive backup (~10 PM) even when the app isn't
  # open right then - uses Android's WorkManager, which needs no special
  # runtime permission prompt (unlike exact-alarm scheduling). See the
  # backup_service.dart comments for what this can and can't guarantee.
  # As of this update, the same WorkManager setup (see
  # core/services/background_tasks.dart) also drives the Daily Orders
  # reminder below.
  workmanager: ^0.10.7

  # Daily Orders reminder notification (Daily Orders feature) - shows a
  # local, on-device notification at the shop's chosen order-send time.
  # No account/server/API key needed, and (like WorkManager above) needs
  # no special runtime permission prompt on the Android versions this app
  # targets.
  flutter_local_notifications: ^17.2.2

  # Admin PIN hashing
  crypto: ^3.0.3

  # Daily Orders home-screen widget (Phase 2) - bridges data from the app's
  # SQLite database to the native Android widget (see
  # DailyOrderWidgetService / DailyOrderWidgetProvider.kt). Android-only
  # widget for now, matching the "phone's home screen widget" request.
  home_widget: ^0.9.3

  # Lets a customer intimation explicitly open in WhatsApp Business
  # instead of regular WhatsApp when both are installed (Settings ->
  # WhatsApp Sending) - see WhatsAppSmsService.sendWhatsApp. Android-only,
  # matching the rest of this app.
  android_intent_plus: ^6.1.0

  # Share button next to each Local Backup file (Settings -> Backup &
  # Restore) - hands the .db file to WhatsApp/Drive/email/a file
  # manager's own "Save a copy", since the file itself lives in the app's
  # private storage and never shows up in the phone's Files app on its
  # own.
  share_plus: ^13.3.0

  # "Restore from File" button (Settings -> Backup & Restore) - opens
  # Android's native file picker so a backup .db file saved anywhere on
  # the phone (Downloads, a WhatsApp/Drive download, etc.), not just this
  # app's own private backups, can be restored (spec: "restore button
  # click panna file choose panra maadhiri vaikkanum").
  file_picker: ^12.0.0

  # "Pick from Contacts" on the Daily Order supplier phone field - lets the
  # shop choose the supplier's number from the phone's own saved Contacts
  # app instead of retyping it (spec: "phone number kekkutho anga contact
  # app la erunthu choose panramathiri panni kudu").
  flutter_contacts: ^1.1.9+2

  # --- Daily Google Drive backup rewrite (2026-08) -----------------------
  # See backup_service.dart's class doc comment for the full "why": the old
  # one-file-per-month, update-in-place Drive backup was replaced with a
  # brand new independent snapshot file every day, verified end-to-end
  # before ever showing "Backup Successful".

  # Zips the daily database + attachment snapshot into one .zip file before
  # it ever reaches Google Drive (spec: "create snapshot before upload").
  archive: ^3.6.1

  # Lets a due-check / manual "Backup Now" fail fast and honestly as
  # "Backup Pending - Waiting for Internet" instead of only discovering the
  # phone is offline after a slow, ambiguous network timeout deep inside
  # the Drive upload call.
  connectivity_plus: ^6.0.5

  # appVersion recorded inside every backup's manifest.json (spec item 14:
  # "each backup must contain metadata: App version...") so an old backup
  # restored on a much newer/older app build can be told apart from a
  # schema/format problem.
  package_info_plus: ^10.2.1

  # Exact ~10 PM daily trigger for the Google Drive backup (spec: "Use
  # Android AlarmManager / exact alarm where permitted. Do not depend only
  # on WorkManager for exact 10 PM timing"). Unlike a raw AlarmManager +
  # BroadcastReceiver (which can only run plain native Kotlin, e.g. show a
  # notification - see DailyOrderAlarmReceiver.kt), this plugin's exact
  # alarm actually re-enters the Dart VM in a background isolate, so the
  # real backup logic (BackupService, Drive upload, sqflite, http) can run
  # directly from the alarm instead of only being able to nudge the shop to
  # open the app. WorkManager (see background_tasks.dart) stays registered
  # alongside this as the required fallback/retry mechanism - see that
  # file's doc comments for how the two avoid creating duplicate backups.
  android_alarm_manager_plus: ^4.0.4

  # Mic button on Quick Income/Quick Expense (spec: "adikkadi type panni
  # text enter panna mudiyathu so mic touch panni petrol 50 rupees nu
  # sonna enakku expenses la petrol add pannittu 50 ah amount la add
  # pannanum" - speak an entry instead of typing it every time). Handles
  # requesting the RECORD_AUDIO runtime permission itself via initialize().
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_color.png
    - assets/images/logo_bw.png
    - assets/images/logo_bw_1bit.png
    - assets/images/terms_note.png
    - assets/images/terms_note_secondhand.png
    - assets/images/terms_note_accessories.png
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_color.png"
  min_sdk_android: 21
